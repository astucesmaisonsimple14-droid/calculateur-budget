<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur d'Épargne</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3169883354146333" crossorigin="anonymous"></script>
<style>
  :root {
    --cream: #FAF6F0;
    --terracotta: #C97B5A;
    --terracotta-dark: #A8613F;
    --green: #6B8F71;
    --red: #C15C5C;
    --ink: #3A3229;
    --line: #E4D9CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--terracotta-dark);
  }
  p.sub {
    margin: 0 0 24px;
    font-size: 0.9rem;
    color: #8a7f70;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--terracotta); }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  .result {
    margin-top: 28px;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    background: var(--cream);
    border: 1px solid var(--line);
  }
  .result .amount {
    font-size: 2rem;
    font-weight: 700;
    margin: 4px 0;
    color: var(--green);
  }
  .result .label {
    font-size: 0.85rem;
    color: #8a7f70;
  }
  .nav {
    text-align: center;
    margin-top: 20px;
    font-size: 0.85rem;
  }
  .nav a {
    color: var(--terracotta-dark);
    text-decoration: none;
    margin: 0 8px;
  }
  .nav a:hover { text-decoration: underline; }
  .ad-placeholder {
    margin-top: 24px;
    padding: 14px;
    text-align: center;
    font-size: 0.75rem;
    color: #b0a794;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🐷 Calculateur d'Épargne</h1>
    <p class="sub">Découvrez en combien de temps vous atteindrez votre objectif.</p>

    <label for="objectif">Montant à épargner (€)</label>
    <input type="number" id="objectif" placeholder="Ex : 3000" oninput="calculer()">

    <label for="epargneMensuelle">Épargne mensuelle (€)</label>
    <input type="number" id="epargneMensuelle" placeholder="Ex : 150" oninput="calculer()">

    <label for="dejaEpargne">Déjà épargné (€) — optionnel</label>
    <input type="number" id="dejaEpargne" placeholder="Ex : 200" oninput="calculer()">

    <div class="result">
      <div class="label">Temps nécessaire pour atteindre l'objectif</div>
      <div class="amount" id="resultat">—</div>
      <div class="label" id="message"></div>
    </div>

    <div class="nav">
      <a href="index.html">Calculateur de budget</a> ·
      <a href="calculateur-credit.html">Coût d'un crédit</a> ·
      <a href="apropos.html">À propos</a> ·
      <a href="mentions-legales.html">Mentions légales</a>
    </div>

    <div class="ad-placeholder">— emplacement publicité (Google AdSense) —</div>
  </div>

  <script>
    function calculer() {
      const objectif = parseFloat(document.getElementById('objectif').value) || 0;
      const mensuel = parseFloat(document.getElementById('epargneMensuelle').value) || 0;
      const deja = parseFloat(document.getElementById('dejaEpargne').value) || 0;

      const resultatEl = document.getElementById('resultat');
      const messageEl = document.getElementById('message');

      const restant = objectif - deja;

      if (mensuel <= 0 || objectif <= 0) {
        resultatEl.textContent = '—';
        messageEl.textContent = 'Remplissez les champs ci-dessus';
        return;
      }

      if (restant <= 0) {
        resultatEl.textContent = 'Objectif atteint !';
        messageEl.textContent = '🎉';
        return;
      }

      const mois = restant / mensuel;
      const moisArrondi = Math.ceil(mois);
      const annees = Math.floor(moisArrondi / 12);
      const moisRestants = moisArrondi % 12;

      let texte = '';
      if (annees > 0) {
        texte += annees + (annees > 1 ? ' ans' : ' an');
        if (moisRestants > 0) texte += ' et ' + moisRestants + (moisRestants > 1 ? ' mois' : ' mois');
      } else {
        texte = moisArrondi + (moisArrondi > 1 ? ' mois' : ' mois');
      }

      resultatEl.textContent = texte;
      messageEl.textContent = 'À raison de ' + mensuel + ' € par mois';
    }
  </script>
</body>
</html>
