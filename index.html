<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de Budget Mensuel</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3169883354146333" crossorigin="anonymous"></script>
<style>
  :root {
    --cream: #FAF6F0;
    --terracotta: #C97B5A;
    --terracotta-dark: #A8613F;
    --green: #6B8F71;
    --red: #C15C5C;
    --ink: #3A3229;
    --line: #E4D9CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--terracotta-dark);
  }
  p.sub {
    margin: 0 0 24px;
    font-size: 0.9rem;
    color: #8a7f70;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--terracotta); }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div { flex: 1; }
  .result {
    margin-top: 28px;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    background: var(--cream);
    border: 1px solid var(--line);
  }
  .result .amount {
    font-size: 2rem;
    font-weight: 700;
    margin: 4px 0;
  }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .result .label {
    font-size: 0.85rem;
    color: #8a7f70;
  }
  .nav {
    text-align: center;
    margin-top: 20px;
    font-size: 0.85rem;
  }
  .nav a {
    color: var(--terracotta-dark);
    text-decoration: none;
    margin: 0 8px;
  }
  .nav a:hover { text-decoration: underline; }
  .ad-placeholder {
    margin-top: 24px;
    padding: 14px;
    text-align: center;
    font-size: 0.75rem;
    color: #b0a794;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>💰 Calculateur de Budget Mensuel</h1>
    <p class="sub">Entrez vos revenus et dépenses pour voir ce qu'il vous reste.</p>

    <label for="revenu">Revenus mensuels (€)</label>
    <input type="number" id="revenu" placeholder="Ex : 1800" oninput="calculer()">

    <div class="row">
      <div>
        <label for="loyer">Loyer / Crédit (€)</label>
        <input type="number" id="loyer" placeholder="Ex : 600" oninput="calculer()">
      </div>
      <div>
        <label for="charges">Charges (€)</label>
        <input type="number" id="charges" placeholder="Ex : 150" oninput="calculer()">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="alimentation">Alimentation (€)</label>
        <input type="number" id="alimentation" placeholder="Ex : 300" oninput="calculer()">
      </div>
      <div>
        <label for="autres">Autres dépenses (€)</label>
        <input type="number" id="autres" placeholder="Ex : 200" oninput="calculer()">
      </div>
    </div>

    <div class="result">
      <div class="label">Il vous reste chaque mois</div>
      <div class="amount" id="resultat">0 €</div>
      <div class="label" id="message"></div>
    </div>

    <div class="nav">
      <a href="calculateur-epargne.html">Calculateur d'épargne</a> ·
      <a href="calculateur-credit.html">Coût d'un crédit</a> ·
      <a href="apropos.html">À propos</a> ·
      <a href="mentions-legales.html">Mentions légales</a>
    </div>

    <div class="ad-placeholder">— emplacement publicité (Google AdSense) —</div>
  </div>

  <script>
    function calculer() {
      const revenu = parseFloat(document.getElementById('revenu').value) || 0;
      const loyer = parseFloat(document.getElementById('loyer').value) || 0;
      const charges = parseFloat(document.getElementById('charges').value) || 0;
      const alimentation = parseFloat(document.getElementById('alimentation').value) || 0;
      const autres = parseFloat(document.getElementById('autres').value) || 0;

      const total = loyer + charges + alimentation + autres;
      const reste = revenu - total;

      const resultatEl = document.getElementById('resultat');
      const messageEl = document.getElementById('message');

      resultatEl.textContent = reste.toFixed(2) + ' €';

      if (reste >= 0) {
        resultatEl.className = 'amount positive';
        messageEl.textContent = reste > 0 ? "Vous êtes dans les clous 👍" : "Budget à l'équilibre";
      } else {
        resultatEl.className = 'amount negative';
        messageEl.textContent = "Attention, vous dépensez plus que vos revenus";
      }
    }
  </script>
</body>
</html>
